<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handsfree - Microphone Setup</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      font-family: 'Inter', sans-serif;
    }
    .permission-card {
      width: 420px;
      padding: 32px;
      background: rgba(18, 24, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .mic-icon-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.5);
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .grant-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }
    .grant-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }
    .status-msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .status-info {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .status-success {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="permission-card">
    <div class="mic-icon-large">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </div>

    <h2>Microphone Setup</h2>
    <p>Handsfree requires microphone access to listen to your voice commands and transcribe speech.</p>

    <button id="requestBtn" class="grant-btn" type="button">Allow Microphone Access</button>

    <div id="statusMsg" class="status-msg status-info">
      Click "Allow Microphone Access" above and select <strong>Allow</strong> in the Chrome popup.
    </div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
