<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handsfree Camera Access</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eaeaea;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0; }
    p { color: rgba(255,255,255,0.7); font-size: 14px; margin: 0; max-width: 360px; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #4ecdc4, #2a9d8f);
      color: #0d1b2a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Camera Access</h1>
  <p id="msg">Requesting camera permission so Handsfree can track your head and hands.</p>
  <button id="retry" style="display:none">Allow Camera</button>
  <script type="module" src="./permission.ts"></script>
</body>
</html>
